<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
     <link rel="stylesheet" href="hospital.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="appointment-section">
     <header class="appointment-header">
        <!--logo-->
        <div class="appointment-logo">
         <i class="fa-solid fa-heart-pulse"></i>
         <h2>Lifeline Hospital</h2>
        </div>

        <!--nav-link-->
        <nav class="appointment-links">
           <a href="index.html">Home
           <a href="about.html">About</a>
           <a href="services.html">Services</a>
           <a href="doctors.html">Doctors</a>
           <a href="appointments.html">Appointments</a>
           <a href="contact.html">Contact</a>
        </nav>
    </header>

  <div class="appointments">
    <h1>Book an Appointment</h1>
    <p>Schedule a visit with our medical experts - your health is our priority</p>
 
    <div class="form-container">
     <form>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

         <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
        </div>

         <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>
        </div>

         <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date"  required>
        </div>

         <div class="form-group">
           <label for="doctor">Select Doctor</label>
           <select id="doctor" required>
            <option value="">Select Doctor</option>
            <option>Dr.Sarah Johnson (Cardiologist)</option>
             <option>Dr.Micheal Adeyemi (Surgeon)</option>
              <option>Dr.Anita Okafor (Pediatrician)</option>
               <option>Dr.David Olu (Orthopedic Specialist)</option>
                <option>Dr.Grace Bello (Gynecologist)</option>
                 <option>Dr.Kelvin Uche (Neurologist)</option>
           </select>

           <label for="message">Additional Message (optional)</label>
           <textarea id="message" rows="4" placeholder="Describe your concern"></textarea>

           <button type="submit" class="appointment-btn">Book Appointment</button>
        </div>
     </form>

     <div class="contact-info">
        <p>Need help?  Call<strong>+234 704 636 4057</strong> or email <strong>emmanuelsalami863@gmail.com</strong></p>
     </div>
    </div>   
</div>
</body>
</html>
